schema_version: 1

context:
  name: openkim-models
  version: "2021.01.28"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://s3.openkim.org/archives/collection/${{ name }}-${{ version|replace('.', '-') }}.txz
  sha256: 8824adee02ae4583bd378cc81140fbb49515c5965708ee98d856d122d48dd95f

build:
  number: 3
  skip: win

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ compiler('fortran') }}
    - ${{ stdlib("c") }}
    - cmake
    - make
    - vim
  host:
    - kim-api >=2.2.1,<=2.3.0
  run:
    - kim-api >=2.2.1,<=2.3.0

tests:
  - script:
      - kim-api-collections-management list

about:
  license: CDDL-1.0
  license_file: ${{ name }}-${{ version|replace('.', '-') }}/LICENSE
  summary: All OpenKIM Models compatible with kim-api
  description: |
    All OpenKIM Models compatible with kim-api.
  homepage: https://openkim.org
  repository: https://openkim.org
  documentation: https://openkim.org/doc/usage/obtaining-models/

extra:
  recipe-maintainers:
    - jan-janssen
    - ellio167
    - ilia-nikiforov-umn
